name = "neo-api"
main = "src/index.ts"
compatibility_date = "2026-11-20"
workers_dev = true

[triggers]
crons = ["*/15 * * * *"]

[vars]
NEO_ENV = "staging"
MAX_REQUESTS_PER_MINUTE = "60"
MAX_MONTHLY_SPEND_USD_MICROS = "0"
MAX_MONTHLY_INPUT_TOKENS = "0"
MAX_MONTHLY_OUTPUT_TOKENS = "0"
MAX_PROMPT_BYTES = "128000"
MAX_OUTPUT_TOKENS = "1024"
MODEL_PRIMARY_INPUT_USD_MICROS_PER_1M = "0"
MODEL_PRIMARY_OUTPUT_USD_MICROS_PER_1M = "0"
MODEL_BACKUP_INPUT_USD_MICROS_PER_1M = "0"
MODEL_BACKUP_OUTPUT_USD_MICROS_PER_1M = "0"
VOICE_TRANSCRIBE_MAX_COST_USD_MICROS = "0"
VOICE_SYNTHESIS_MAX_COST_USD_MICROS = "0"
MAX_BODY_BYTES = "1000000"
ACCESS_TEAM_DOMAIN = "https://replace-with-your-team.cloudflareaccess.com"
ACCESS_AUD = "replace-with-access-application-audience"
MODEL_PRIMARY_NAME = "unset"
MODEL_BACKUP_NAME = "unset"
MODEL_PRIMARY_URL = ""
MODEL_BACKUP_URL = ""

[[d1_databases]]
binding = "DB"
database_name = "neo-staging"
database_id = "REPLACE_AFTER_CREATING_D1"
migrations_dir = "../migrations"

# Configure provider credentials with: wrangler secret put MODEL_PRIMARY_API_KEY
# Never place provider keys, Access signing keys, or user encryption keys in vars.
