name: NEO encrypted D1 backup restore to isolated recovery database

on:
  workflow_dispatch:
    inputs:
      backup_run_id:
        description: "GitHub Actions run ID of a successful NEO encrypted disposable D1 backup"
        required: true
        type: string
      confirm_restore:
        description: "Confirm restore into neo-staging-recovery-test only"
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: neo-d1-isolated-recovery-restore
  cancel-in-progress: false

jobs:
  restore-isolated:
    if: inputs.confirm_restore == true && github.ref == 'refs/heads/neo/foundation-architecture'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_RECOVERY_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      AGE_IDENTITY: ${{ secrets.NEO_BACKUP_AGE_IDENTITY }}
      EXPECTED_SOURCE_D1_ID: dd4c03d6-a286-4ac9-abbc-8f162b692acc
      EXPECTED_TARGET_D1_ID: a426343d-7c85-4441-a46a-7b7cead38ceb
      EXPECTED_TARGET_NAME: neo-staging-recovery-test
      BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Validate explicit inputs and required credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BACKUP_RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::Backup run ID must be numeric."; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Set CLOUDFLARE_D1_RECOVERY_TOKEN, scoped only to neo-staging-recovery-test."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID variable."; exit 1; }
          test -n "$AGE_IDENTITY" || { echo "::error::Set NEO_BACKUP_AGE_IDENTITY as a GitHub Actions secret; never commit or paste the private key."; exit 1; }
          printf '%s\n' "$AGE_IDENTITY" | grep -q '^AGE-SECRET-KEY-' || { echo "::error::Invalid age identity format."; exit 1; }
      - name: Install age and SQLite
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq age sqlite3
          cd infra/cloudflare/worker
          npm install --ignore-scripts --no-audit --no-fund
      - name: Download the encrypted backup artifact from the selected run
        uses: actions/download-artifact@v7
        with:
          name: neo-staging-d1-encrypted-backup-${{ inputs.backup_run_id }}
          run-id: ${{ inputs.backup_run_id }}
          github-token: ${{ github.token }}
          path: /tmp/neo-d1-backup
      - name: Verify artifact provenance, checksum and source identity
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/neo-d1-backup
          test -s neo-staging-db.sql.age
          test -s SHA256SUMS
          test -s backup-manifest.txt
          sha256sum -c SHA256SUMS
          grep -Fqx "Database UUID: $EXPECTED_SOURCE_D1_ID" backup-manifest.txt || { echo "::error::Backup source UUID mismatch."; exit 1; }
          grep -Eq '^Commit: [0-9a-f]{40}$' backup-manifest.txt || { echo "::error::Backup commit metadata is invalid."; exit 1; }
          grep -Eq '^Created UTC: .+Z$' backup-manifest.txt || { echo "::error::Backup timestamp is invalid."; exit 1; }
      - name: Decrypt only on the ephemeral runner and validate SQL locally
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$AGE_IDENTITY" > /tmp/neo-backup-age-identity.txt
          age --decrypt --identity /tmp/neo-backup-age-identity.txt --output /tmp/neo-staging-db.sql /tmp/neo-d1-backup/neo-staging-db.sql.age
          test -s /tmp/neo-staging-db.sql
          sqlite3 /tmp/neo-backup-verify.db < /tmp/neo-staging-db.sql
          test "$(sqlite3 /tmp/neo-backup-verify.db 'PRAGMA integrity_check;')" = "ok"
          test -z "$(sqlite3 /tmp/neo-backup-verify.db 'PRAGMA foreign_key_check;')"
          sqlite3 /tmp/neo-backup-verify.db "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%';" > /tmp/source-table-count
          echo "Decryption and local SQLite integrity checks passed."
      - name: Materialize recovery-only Wrangler config
        shell: bash
        run: |
          set -euo pipefail
          cp infra/cloudflare/wrangler.disposable.example.toml infra/cloudflare/wrangler.recovery.toml
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const p = "infra/cloudflare/wrangler.recovery.toml";
          let c = fs.readFileSync(p, "utf8");
          const id = process.env.GOOGLE_WEB_CLIENT_ID || "recovery-verification-unused";
          c = c.replaceAll("REPLACE-WITH-GOOGLE-WEB-CLIENT-ID", id);
          c = c.replace('database_name = "neo-staging-db"', 'database_name = "neo-staging-recovery-test"');
          c = c.replace('database_id = "dd4c03d6-a286-4ac9-abbc-8f162b692acc"', 'database_id = "a426343d-7c85-4441-a46a-7b7cead38ceb"');
          if (!c.includes('database_name = "neo-staging-recovery-test"') || !c.includes('database_id = "a426343d-7c85-4441-a46a-7b7cead38ceb"')) throw new Error("Recovery target substitution failed");
          if (c.includes('database_id = "dd4c03d6-a286-4ac9-abbc-8f162b692acc"')) throw new Error("Source staging UUID remains in recovery config");
          if (c.includes("REPLACE-WITH-")) throw new Error("Unresolved config placeholder");
          fs.writeFileSync(p,c);
          NODE
      - name: Verify remote identity and require an empty recovery target
        working-directory: infra/cloudflare/worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 info neo-staging-recovery-test --json --config ../wrangler.recovery.toml >/tmp/recovery-info.json 2>/tmp/recovery-info.log || { echo "::error::Could not inspect recovery database; CLI output withheld."; exit 1; }
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const data=JSON.parse(fs.readFileSync("/tmp/recovery-info.json","utf8"));
          const ids=[];
          function walk(x){if(!x||typeof x!=="object")return;for(const [k,v] of Object.entries(x)){if(["uuid","database_id","databaseId"].includes(k)&&typeof v==="string")ids.push(v);walk(v);}}
          walk(data);
          if(!ids.includes(process.env.EXPECTED_TARGET_D1_ID))throw new Error("Remote recovery database UUID mismatch; refusing restore");
          NODE
          npx wrangler d1 execute neo-staging-recovery-test --remote --config ../wrangler.recovery.toml --command "SELECT COUNT(*) AS user_tables FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' AND name NOT LIKE '_cf_%';" --json >/tmp/recovery-empty-check.json 2>/tmp/recovery-empty-check.log || { echo "::error::Could not verify target emptiness; CLI output withheld."; exit 1; }
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const s=fs.readFileSync("/tmp/recovery-empty-check.json","utf8");
          const j=JSON.parse(s);
          const vals=[];
          function walk(x){if(!x||typeof x!=="object")return;if(Array.isArray(x)){for(const v of x)walk(v);return;}for(const [k,v] of Object.entries(x)){if(k==="user_tables"&&typeof v==="number")vals.push(v);walk(v);}}
          walk(j);
          if(vals.length!==1||vals[0]!==0)throw new Error("Recovery target is not provably empty; refusing restore");
          NODE
      - name: Restore SQL into the recovery database only
        working-directory: infra/cloudflare/worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute neo-staging-recovery-test --remote --config ../wrangler.recovery.toml --file=/tmp/neo-staging-db.sql >/tmp/recovery-import.log 2>&1 || { echo "::error::Import failed; Wrangler output withheld."; exit 1; }
          echo "Encrypted backup SQL imported into the separately identified recovery database."
      - name: Verify restored database integrity and migration metadata
        working-directory: infra/cloudflare/worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute neo-staging-recovery-test --remote --config ../wrangler.recovery.toml --command "PRAGMA integrity_check;" --json >/tmp/recovery-integrity.json 2>/tmp/recovery-integrity.log || { echo "::error::Remote integrity check failed; CLI output withheld."; exit 1; }
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const j=JSON.parse(fs.readFileSync("/tmp/recovery-integrity.json","utf8"));
          const strings=[];
          function walk(x){if(!x||typeof x!=="object")return;if(Array.isArray(x)){for(const v of x)walk(v);return;}for(const [k,v] of Object.entries(x)){if(typeof v==="string")strings.push(v);walk(v);}}
          walk(j);
          if(!strings.includes("ok"))throw new Error("Remote D1 integrity_check did not return ok");
          NODE
          npx wrangler d1 execute neo-staging-recovery-test --remote --config ../wrangler.recovery.toml --command "PRAGMA foreign_key_check;" --json >/tmp/recovery-fk.json 2>/tmp/recovery-fk.log || { echo "::error::Remote foreign-key check failed; CLI output withheld."; exit 1; }
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const j=JSON.parse(fs.readFileSync("/tmp/recovery-fk.json","utf8"));
          const rows=[];
          function walk(x){if(!x||typeof x!=="object")return;if(Array.isArray(x)){for(const v of x)walk(v);return;}if(Array.isArray(x.results))rows.push(...x.results);for(const v of Object.values(x))walk(v);}
          walk(j);
          if(rows.some(x=>Array.isArray(x)&&x.length))throw new Error("Remote foreign-key violations found");
          NODE
          echo "Remote integrity and foreign-key checks passed."
      - name: Cleanup decrypted material
        if: always()
        shell: bash
        run: |
          rm -f /tmp/neo-staging-db.sql /tmp/neo-backup-verify.db /tmp/neo-backup-age-identity.txt /tmp/recovery-info.json /tmp/recovery-info.log /tmp/recovery-empty-check.json /tmp/recovery-empty-check.log /tmp/recovery-import.log /tmp/recovery-integrity.json /tmp/recovery-integrity.log /tmp/recovery-fk.json /tmp/recovery-fk.log /tmp/source-table-count
          rm -rf /tmp/neo-d1-backup
