name = "neo-api-integration-test"
main = "src/index.ts"
compatibility_date = "2026-11-20"
workers_dev = false

[vars]
NEO_ENV = "test"
MAX_REQUESTS_PER_MINUTE = "60"
MAX_BODY_BYTES = "1000000"
MAX_MONTHLY_SPEND_USD_MICROS = "5000"
MAX_PROMPT_BYTES = "128000"
MAX_OUTPUT_TOKENS = "1024"
ACCESS_TEAM_DOMAIN = "https://neo-test.cloudflareaccess.com"
ACCESS_AUD = "neo-integration-test-audience"
MODEL_PRIMARY_NAME = "primary-model"
MODEL_PRIMARY_URL = "https://primary.provider.test/v1"
MODEL_PRIMARY_API_KEY = "test-primary-key"
MODEL_PRIMARY_INPUT_USD_MICROS_PER_1M = "1000000"
MODEL_PRIMARY_OUTPUT_USD_MICROS_PER_1M = "2000000"
MODEL_BACKUP_NAME = "backup-model"
MODEL_BACKUP_URL = "https://backup.provider.test/v1"
MODEL_BACKUP_API_KEY = "test-backup-key"
MODEL_BACKUP_INPUT_USD_MICROS_PER_1M = "1000000"
MODEL_BACKUP_OUTPUT_USD_MICROS_PER_1M = "2000000"
VOICE_TRANSCRIBE_MAX_COST_USD_MICROS = "1000"
VOICE_SYNTHESIS_MAX_COST_USD_MICROS = "1000"

[[d1_databases]]
binding = "DB"
database_name = "neo-integration-test"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "../migrations"
