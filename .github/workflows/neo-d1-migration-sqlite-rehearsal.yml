name: NEO exact D1 migration SQLite rehearsal

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "infra/cloudflare/migrations/*.sql"
      - ".github/workflows/neo-d1-migration-sqlite-rehearsal.yml"
      - ".github/workflows/neo-disposable-staging.yml"
      - "infra/cloudflare/D1_STAGING_RUNBOOK.md"
      - "infra/cloudflare/worker/D1_BACKUP_RECOVERY_RUNBOOK.md"
  push:
    branches:
      - neo/foundation-architecture
    paths:
      - "infra/cloudflare/migrations/*.sql"
      - ".github/workflows/neo-d1-migration-sqlite-rehearsal.yml"
      - ".github/workflows/neo-disposable-staging.yml"
      - "infra/cloudflare/D1_STAGING_RUNBOOK.md"
      - "infra/cloudflare/worker/D1_BACKUP_RECOVERY_RUNBOOK.md"

permissions:
  contents: read

jobs:
  exact-migration-chain:
    name: exact-migration-chain
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout engineering branch
        uses: actions/checkout@v7

      - name: Verify remote migration gate matches the exact tested migration chain
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import os

          migration_files = sorted(os.path.basename(path) for path in glob.glob("infra/cloudflare/migrations/*.sql"))
          gate = open(".github/workflows/neo-disposable-staging.yml", encoding="utf-8").read()
          marker = "expected=\"$(cat <<'EOF'\\n"
          assert marker in gate, "Migration gate's exact-file allow-list is missing"
          block = gate.split(marker, 1)[1].split("\\n          EOF\\n          )", 1)[0]
          gate_files = [line.strip() for line in block.splitlines() if line.strip()]
          assert gate_files == migration_files, f"Remote gate allow-list differs from tested migrations: {gate_files}"
          assert "APPLY_0001_0012" in gate, "Migration approval label is not aligned to 0012"
          assert "APPLY_0001_0011" not in gate, "Stale 0011-only approval label remains"
          print(f"PASS migration gate allow-list matches {len(migration_files)} exact files")
          PY

      - name: Execute exact migration files against isolated SQLite
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import os
          import sqlite3
          import tempfile

          paths = sorted(glob.glob("infra/cloudflare/migrations/*.sql"))
          expected = [f"{n:04d}_" for n in range(1, 13)]
          assert len(paths) == 12, f"Expected exactly 12 migrations, found {len(paths)}"
          for path, prefix in zip(paths, expected, strict=True):
              assert os.path.basename(path).startswith(prefix), f"Unexpected migration order: {path}"

          fd, db_path = tempfile.mkstemp(prefix="neo-migrations-", suffix=".sqlite")
          os.close(fd)
          try:
              db = sqlite3.connect(db_path)
              try:
                  db.execute("PRAGMA foreign_keys = ON")
                  assert db.execute("PRAGMA foreign_keys").fetchone()[0] == 1
                  for path in paths:
                      with open(path, encoding="utf-8") as migration:
                          sql = migration.read()
                      assert sql.strip(), f"Empty migration: {path}"
                      db.executescript(sql)
                      violations = db.execute("PRAGMA foreign_key_check").fetchall()
                      assert not violations, f"Foreign-key violations after {path}: {violations}"
                      print(f"PASS {path}")

                  integrity = db.execute("PRAGMA integrity_check").fetchone()[0]
                  assert integrity == "ok", f"SQLite integrity_check failed: {integrity}"
                  objects = db.execute(
                      "SELECT type, name FROM sqlite_master "
                      "WHERE name NOT LIKE 'sqlite_%' ORDER BY type, name"
                  ).fetchall()
                  assert objects, "Migrations created no schema objects"
                  print(f"PASS foreign_key_check after all {len(paths)} migrations")
                  print(f"PASS integrity_check: {integrity}")
                  print(f"PASS schema objects created: {len(objects)}")
                  for kind, name in objects:
                      print(f"SCHEMA {kind}: {name}")

                  # Exercise the exact provider-ledger migration triggers, not just schema creation.
                  db.execute("INSERT INTO accounts(account_id,created_at,status) VALUES('migration-ledger-test',1,'active')")
                  db.execute("""INSERT INTO provider_spend_usage(account_id,month_key,budget_microusd,monthly_input_token_limit,monthly_output_token_limit,updated_at)
                               VALUES('migration-ledger-test','2099-01',1000,100,100,1)""")
                  db.execute("""INSERT INTO provider_spend_reservations(reservation_id,account_id,month_key,reserved_microusd,reserved_input_tokens,reserved_output_tokens,state,provider_label,created_at)
                               VALUES('ledger-res-1','migration-ledger-test','2099-01',400,40,40,'reserved','rehearsal',2)""")
                  usage = db.execute("SELECT reserved_microusd,reserved_input_tokens,reserved_output_tokens FROM provider_spend_usage WHERE account_id='migration-ledger-test'").fetchone()
                  assert usage == (400,40,40), f"Reservation accounting mismatch: {usage}"
                  try:
                      db.execute("""INSERT INTO provider_spend_reservations(reservation_id,account_id,month_key,reserved_microusd,reserved_input_tokens,reserved_output_tokens,state,provider_label,created_at)
                                    VALUES('ledger-res-over','migration-ledger-test','2099-01',700,70,70,'reserved','over-cap',3)""")
                      raise AssertionError("Over-budget reservation unexpectedly succeeded")
                  except sqlite3.IntegrityError as exc:
                      assert "exceeded" in str(exc), f"Unexpected reservation failure: {exc}"
                  db.execute("""UPDATE provider_spend_reservations SET state='settled',settled_microusd=300,settled_input_tokens=30,settled_output_tokens=30,settled_at=4
                                WHERE reservation_id='ledger-res-1'""")
                  usage = db.execute("SELECT reserved_microusd,spent_microusd,reserved_input_tokens,reserved_output_tokens,input_tokens,output_tokens FROM provider_spend_usage WHERE account_id='migration-ledger-test'").fetchone()
                  assert usage == (0,300,0,0,30,30), f"Settlement accounting mismatch: {usage}"
                  try:
                      db.execute("""UPDATE provider_spend_reservations SET settled_microusd=401 WHERE reservation_id='ledger-res-1'""")
                      raise AssertionError("Post-settlement mutation unexpectedly succeeded")
                  except sqlite3.IntegrityError:
                      pass
                  try:
                      db.execute("UPDATE provider_spend_reservations SET settled_microusd=200 WHERE reservation_id='ledger-res-1'")
                      raise AssertionError("Terminal settlement amount unexpectedly changed")
                  except sqlite3.IntegrityError as exc:
                      assert "provider_reservation_terminal_immutable" in str(exc), f"Unexpected terminal-ledger rejection: {exc}"
                  print("PASS 0012 immutable terminal reservation trigger")
                  db.execute("""INSERT INTO provider_spend_reservations(reservation_id,account_id,month_key,reserved_microusd,reserved_input_tokens,reserved_output_tokens,state,provider_label,created_at)
                                VALUES('ledger-res-2','migration-ledger-test','2099-01',200,20,20,'reserved','release-test',5)""")
                  db.execute("UPDATE provider_spend_reservations SET state='released',settled_at=6 WHERE reservation_id='ledger-res-2'")
                  usage = db.execute("SELECT reserved_microusd,spent_microusd,reserved_input_tokens,reserved_output_tokens,input_tokens,output_tokens FROM provider_spend_usage WHERE account_id='migration-ledger-test'").fetchone()
                  assert usage == (0,300,0,0,30,30), f"Release accounting mismatch: {usage}"
                  try:
                      db.execute("UPDATE provider_spend_reservations SET state='settled' WHERE reservation_id='ledger-res-2'")
                      raise AssertionError("Released reservation was unexpectedly resurrected")
                  except sqlite3.IntegrityError as exc:
                      assert "terminal_immutable" in str(exc), f"Unexpected release mutation failure: {exc}"
                  print("PASS provider reservation, over-budget rejection, settlement, immutable settled reservation, and release accounting")
              finally:
                  db.close()
          finally:
              if os.path.exists(db_path):
                  os.unlink(db_path)
          PY
