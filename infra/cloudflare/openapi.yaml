openapi: 3.1.0
info:
  title: NEO Cloud API
  version: 0.1.0
  description: >
    Implemented v0 contract for the cloud-first NEO gateway. All payloads containing
    memory or task content are client-encrypted. This specification is not
    implemented or deployed yet.
servers:
  - url: https://{workerHost}/v1
    variables:
      workerHost:
        default: neo-staging.example.workers.dev
security:
  - cloudflareAccess: []
paths:
  /health:
    get:
      security: []
      summary: Liveness check
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    const: ok
  /devices:
    get:
      summary: List devices registered to the authenticated account
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: Registered devices
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    items:
                      $ref: "#/components/schemas/Device"
    post:
      summary: Enrol a device public key
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label, platform, public_key_jwk, capabilities]
              properties:
                label:
                  type: string
                  maxLength: 80
                platform:
                  type: string
                  enum: [android, ios, windows, macos, linux, browser, other]
                public_key_jwk:
                  type: object
                  additionalProperties: true
                capabilities:
                  type: array
                  items:
                    type: string
      responses:
        "201":
          description: Device enrolled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "409":
          $ref: "#/components/responses/Conflict"
  /devices/{deviceId}:
    delete:
      summary: Revoke a device immediately
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Device revoked
        "404":
          $ref: "#/components/responses/NotFound"
  /memory:
    get:
      summary: Synchronise memory records
      description: Returns encrypted records; approved records are the default recall set.
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - name: cursor
          in: query
          schema:
            type: string
        - name: include_pending
          in: query
          description: Include pending review items for the review UI; never makes them recallable.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Encrypted memory changes
          content:
            application/json:
              schema:
                type: object
                required: [records, next_cursor]
                properties:
                  records:
                    type: array
                    items:
                      $ref: "#/components/schemas/MemoryRecord"
                  next_cursor:
                    type: string
                    nullable: true
    post:
      summary: Create a pending memory candidate
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EncryptedMemoryInput"
      responses:
        "201":
          description: Candidate stored as pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryRecord"
        "409":
          $ref: "#/components/responses/Conflict"
  /memory/{memoryId}/approve:
    post:
      summary: Explicitly approve a pending memory candidate
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - name: memoryId
          in: path
          required: true
          schema:
            type: string
        - name: If-Match
          in: header
          required: true
          description: Expected current revision; stale approvals are rejected.
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Memory promoted to approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryRecord"
        "409":
          $ref: "#/components/responses/Conflict"
  /memory/{memoryId}:
    delete:
      summary: Tombstone a memory record across all devices
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - name: memoryId
          in: path
          required: true
          schema:
            type: string
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deletion tombstone created
        "409":
          $ref: "#/components/responses/Conflict"
  /tasks:
    post:
      summary: Queue work for an authorised online compute worker
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_kind, payload_ciphertext, payload_nonce, key_version]
              properties:
                task_kind:
                  type: string
                payload_ciphertext:
                  type: string
                  contentEncoding: base64
                payload_nonce:
                  type: string
                  contentEncoding: base64
                key_version:
                  type: integer
                  minimum: 1
      responses:
        "202":
          description: Task queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
  /tasks/{taskId}:
    get:
      summary: Get task state
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Task state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          $ref: "#/components/responses/NotFound"
  /chat/completions:
    post:
      summary: Generate a response using the server-side model router
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                model:
                  type: string
                  description: Exact model ID or auto. Explicit IDs never silently fall back.
                allow_fallback:
                  type: boolean
                  default: true
                messages:
                  type: array
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role:
                        enum: [system, user, assistant]
                      content:
                        type: string
      responses:
        "200":
          description: Generated answer with route disclosure
          content:
            application/json:
              schema:
                type: object
                required: [content, route]
                properties:
                  content:
                    type: string
                  route:
                    type: object
                    required: [provider, model, tier, fallback_used]
                    properties:
                      provider:
                        type: string
                      model:
                        type: string
                      tier:
                        enum: [primary, backup, offline]
                      fallback_used:
                        type: boolean
                      fallback_reason:
                        type: string
                        nullable: true
                      estimated_cost_usd:
                        type: number
                        minimum: 0
        "429":
          description: Rate limit or spend cap reached; no weaker model is silently selected.
        "503":
          description: No eligible model is available under current policy.
components:
  securitySchemes:
    cloudflareAccess:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cloudflare Access JWT; Worker must verify issuer, signature, audience, and expiry.
  parameters:
    DeviceId:
      name: X-NEO-Device-ID
      in: header
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
  schemas:
    Device:
      type: object
      required: [device_id, label, platform, status, capabilities]
      properties:
        device_id:
          type: string
        label:
          type: string
        platform:
          type: string
        status:
          enum: [active, revoked]
        capabilities:
          type: array
          items:
            type: string
        last_seen_at:
          type: integer
          nullable: true
    EncryptedMemoryInput:
      type: object
      required: [memory_id, revision, payload_ciphertext, payload_nonce, key_version, source_kind]
      properties:
        memory_id:
          type: string
        revision:
          type: integer
          minimum: 1
        payload_ciphertext:
          type: string
          contentEncoding: base64
        payload_nonce:
          type: string
          contentEncoding: base64
        key_version:
          type: integer
          minimum: 1
        source_kind:
          type: string
    MemoryRecord:
      allOf:
        - $ref: "#/components/schemas/EncryptedMemoryInput"
        - type: object
          required: [trust_state, updated_at]
          properties:
            trust_state:
              enum: [pending, approved, rejected, quarantined, deleted]
            updated_at:
              type: integer
            tombstoned_at:
              type: integer
              nullable: true
    Task:
      type: object
      required: [task_id, state, task_kind]
      properties:
        task_id:
          type: string
        state:
          enum: [queued, leased, running, succeeded, failed, cancelled]
        task_kind:
          type: string
        assigned_device_id:
          type: string
          nullable: true
        lease_expires_at:
          type: integer
          nullable: true
    Conflict:
      description: Revision conflict or idempotency key reused with a different payload.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: string
              current_revision:
                type: integer
                nullable: true
    NotFound:
      description: Resource not found for this account.
