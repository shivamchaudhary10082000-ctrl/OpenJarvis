name: NEO exact D1 migration SQLite rehearsal

on:
  workflow_dispatch:
  push:
    branches:
      - neo/foundation-architecture
    paths:
      - "infra/cloudflare/migrations/*.sql"
      - ".github/workflows/neo-d1-migration-sqlite-rehearsal.yml"

permissions:
  contents: read

jobs:
  exact-migration-chain:
    name: exact-migration-chain
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout engineering branch
        uses: actions/checkout@v7

      - name: Execute exact migration files against isolated SQLite
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import os
          import sqlite3
          import tempfile

          paths = sorted(glob.glob("infra/cloudflare/migrations/*.sql"))
          expected = [f"{n:04d}_" for n in range(1, 12)]
          assert len(paths) == 11, f"Expected exactly 11 migrations, found {len(paths)}"
          for path, prefix in zip(paths, expected, strict=True):
              assert os.path.basename(path).startswith(prefix), f"Unexpected migration order: {path}"

          fd, db_path = tempfile.mkstemp(prefix="neo-migrations-", suffix=".sqlite")
          os.close(fd)
          try:
              db = sqlite3.connect(db_path)
              try:
                  db.execute("PRAGMA foreign_keys = ON")
                  assert db.execute("PRAGMA foreign_keys").fetchone()[0] == 1
                  for path in paths:
                      with open(path, encoding="utf-8") as migration:
                          sql = migration.read()
                      assert sql.strip(), f"Empty migration: {path}"
                      db.executescript(sql)
                      violations = db.execute("PRAGMA foreign_key_check").fetchall()
                      assert not violations, f"Foreign-key violations after {path}: {violations}"
                      print(f"PASS {path}")

                  integrity = db.execute("PRAGMA integrity_check").fetchone()[0]
                  assert integrity == "ok", f"SQLite integrity_check failed: {integrity}"
                  objects = db.execute(
                      "SELECT type, name FROM sqlite_master "
                      "WHERE name NOT LIKE 'sqlite_%' ORDER BY type, name"
                  ).fetchall()
                  assert objects, "Migrations created no schema objects"
                  print(f"PASS foreign_key_check after all {len(paths)} migrations")
                  print(f"PASS integrity_check: {integrity}")
                  print(f"PASS schema objects created: {len(objects)}")
                  for kind, name in objects:
                      print(f"SCHEMA {kind}: {name}")
              finally:
                  db.close()
          finally:
              if os.path.exists(db_path):
                  os.unlink(db_path)
          PY
