name: NEO Android client harness
on:
  pull_request:
    branches: [main]
    paths:
      - "infra/cloudflare/clients/android/**"
      - "infra/cloudflare/clients/android-test-harness/**"
      - ".github/workflows/neo-android-client.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra/cloudflare/clients/android-test-harness
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"
      - run: gradle testDebugUnitTest
  android-instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: infra/cloudflare/clients/android-test-harness
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: "platform-tools emulator platforms;android-36 build-tools;36.0.0 system-images;android-36;google_apis;x86_64"
      # setup-android installs the emulator package but does not add its
      # directory to PATH on every runner image.
      - name: Add Android emulator to PATH
        run: |
          test -x "$ANDROID_HOME/emulator/emulator"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"
      - name: Create Android virtual device
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/android-avd
        run: |
          mkdir -p "$ANDROID_AVD_HOME"
          echo "no" | avdmanager create avd --name neo-api-36 --package "system-images;android-36;google_apis;x86_64" --device "pixel_2"
          test -f "$ANDROID_AVD_HOME/neo-api-36.ini"
          avdmanager list avd
      - name: Grant the runner user access to KVM
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::KVM device /dev/kvm is unavailable on this runner"
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Boot Android emulator
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/android-avd
        run: |
          set -euo pipefail
          test -f "$ANDROID_AVD_HOME/neo-api-36.ini"
          emulator_log="$RUNNER_TEMP/neo-emulator.log"
          "$ANDROID_HOME/emulator/emulator" -avd neo-api-36 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect >"$emulator_log" 2>&1 &
          emulator_pid=$!
          if ! timeout 120 adb wait-for-device; then
            cat "$emulator_log"
            kill "$emulator_pid" 2>/dev/null || true
            exit 1
          fi
          if ! timeout 600 bash -c 'until adb shell getprop sys.boot_completed | tr -d "\\r" | grep -q "1"; do sleep 2; done'; then
            cat "$emulator_log"
            adb logcat -d -t 200 || true
            exit 1
          fi
      - run: gradle connectedDebugAndroidTest
      - name: Build installable instrumentation APKs
        run: gradle assembleDebug assembleDebugAndroidTest
      - name: Upload Android instrumentation APKs
        uses: actions/upload-artifact@v4
        with:
          name: neo-android-test-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 7
