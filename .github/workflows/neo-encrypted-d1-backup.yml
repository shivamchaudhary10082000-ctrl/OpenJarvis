name: NEO encrypted disposable D1 backup

on:
  workflow_dispatch:
    inputs:
      confirm_backup:
        description: "Confirm read-only SQL export of neo-staging-db (no migrations or writes)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: neo-disposable-d1-backup
  cancel-in-progress: false

jobs:
  export-encrypt:
    if: inputs.confirm_backup == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_BACKUP_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      AGE_RECIPIENT: ${{ vars.NEO_BACKUP_AGE_RECIPIENT }}
      EXPECTED_D1_ID: dd4c03d6-a286-4ac9-abbc-8f162b692acc
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Validate backup-only configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Set secret CLOUDFLARE_D1_BACKUP_TOKEN (scoped to the staging database)."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID variable."; exit 1; }
          [[ "$AGE_RECIPIENT" == age1* ]] || { echo "::error::Set NEO_BACKUP_AGE_RECIPIENT to the owner's age public key."; exit 1; }
      - name: Install age and pinned Wrangler package
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          cd infra/cloudflare/worker
          npm install --ignore-scripts --no-audit --no-fund
      - name: Materialize and verify disposable config
        shell: bash
        run: |
          set -euo pipefail
          cp infra/cloudflare/wrangler.disposable.example.toml infra/cloudflare/wrangler.disposable.toml
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const p = "infra/cloudflare/wrangler.disposable.toml";
          const c = fs.readFileSync(p, "utf8");
          for (const x of ['name = "neo-api-disposable-staging"', 'database_name = "neo-staging-db"', 'database_id = "dd4c03d6-a286-4ac9-abbc-8f162b692acc"']) {
            if (!c.includes(x)) throw new Error("Refusing: config identity mismatch: " + x);
          }
          if (c.includes("REPLACE-WITH-") || c.includes("[triggers]")) throw new Error("Placeholder or trigger found");
          fs.writeFileSync(p,c);
          NODE
      - name: Verify D1 identity
        working-directory: infra/cloudflare/worker
        run: |
          set -euo pipefail
          npx wrangler d1 info neo-staging-db --json --config ../wrangler.disposable.toml >/tmp/info.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const data=JSON.parse(fs.readFileSync("/tmp/info.json","utf8"));
          const ids=[];
          function walk(x){if(!x||typeof x!=="object")return;for(const [k,v] of Object.entries(x)){if(["uuid","database_id","databaseId"].includes(k)&&typeof v==="string")ids.push(v);walk(v);}}
          walk(data);
          if(!ids.includes(process.env.EXPECTED_D1_ID))throw new Error("Remote D1 UUID did not match approved staging DB");
          NODE
      - name: Export SQL (withhold Wrangler output)
        working-directory: infra/cloudflare/worker
        shell: bash
        run: |
          set -euo pipefail
          if ! npx wrangler d1 export neo-staging-db --remote --output=/tmp/neo-staging-db.sql --config ../wrangler.disposable.toml >/tmp/wrangler-export.log 2>&1; then
            echo "::error::Export failed; CLI output withheld to prevent signed URL leakage."
            exit 1
          fi
          test -s /tmp/neo-staging-db.sql
      - name: Encrypt export and create integrity manifest
        shell: bash
        run: |
          set -euo pipefail
          age --encrypt --recipient "$AGE_RECIPIENT" --output /tmp/neo-staging-db.sql.age /tmp/neo-staging-db.sql
          test -s /tmp/neo-staging-db.sql.age
          sha256sum /tmp/neo-staging-db.sql.age >/tmp/SHA256SUMS
          printf 'Database UUID: %s\nCommit: %s\nCreated UTC: %s\n' "$EXPECTED_D1_ID" "$GITHUB_SHA" "$(date -u +%FT%TZ)" >/tmp/backup-manifest.txt
          echo "Only encrypted SQL, checksum, and metadata manifest will be uploaded."
      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: neo-staging-d1-encrypted-backup-${{ github.run_id }}
          path: |
            /tmp/neo-staging-db.sql.age
            /tmp/SHA256SUMS
            /tmp/backup-manifest.txt
          if-no-files-found: error
          retention-days: 30
      - name: Cleanup plaintext export
        if: always()
        run: rm -f /tmp/neo-staging-db.sql /tmp/wrangler-export.log /tmp/info.json
